<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BalanceViewer · KuCoin + Wallet</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#121722; --panel2:#161d2b; --line:#222b3d;
    --text:#e8edf7; --muted:#8b97ad; --dim:#5f6b82;
    --green:#2ecc9b; --purple:#9b8cff; --amber:#f0b429; --red:#ff6b6b;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:32px 20px 64px; background:
      radial-gradient(900px 420px at 12% -8%, #16324a 0%, transparent 60%),
      radial-gradient(760px 380px at 92% -12%, #2a1c4a 0%, transparent 58%),
      var(--bg);
    color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1080px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between;margin-bottom:26px}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
  h1{font-size:15px;margin:6px 0 0;font-weight:600;color:var(--muted);letter-spacing:.01em}
  .total{font:600 44px/1 var(--mono);letter-spacing:-.02em;margin-top:10px;
    background:linear-gradient(100deg,#fff 10%,#b9c6e0 55%,#7f8fb0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .total .unit{font-size:18px;color:var(--dim);-webkit-text-fill-color:var(--dim);margin-left:6px}
  .toolbar{display:flex;align-items:center;gap:10px}
  button{
    font:600 13px/1 inherit;color:var(--text);background:var(--panel2);
    border:1px solid var(--line);border-radius:9px;padding:10px 14px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;transition:border-color .15s,background .15s
  }
  button:hover{border-color:#33405a;background:#1a2233}
  button:disabled{opacity:.55;cursor:progress}
  button.primary{background:linear-gradient(180deg,#1f6f5c,#175a4b);border-color:#25795f}
  button.primary:hover{background:linear-gradient(180deg,#23806a,#1a6553)}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .stamp{font:12px/1.4 var(--mono);color:var(--dim);text-align:right}
  .stamp b{color:var(--muted);font-weight:500}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:820px){.cards{grid-template-columns:1fr}}
  .card{
    background:linear-gradient(180deg,var(--panel) 0%,#0f141e 100%);
    border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 18px 40px -28px #000;
  }
  .card-head{padding:18px 20px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 4px #ffffff0b}
  .card h2{font-size:14px;margin:0;font-weight:650;letter-spacing:.01em}
  .card .sub{font:11.5px/1.4 var(--mono);color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .src-total{font:600 21px/1.1 var(--mono);text-align:right;white-space:nowrap}
  .src-total small{display:block;font:500 11px/1.6 var(--mono);color:var(--dim);letter-spacing:.02em}
  .rows{padding:6px 8px 10px}
  .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 12px;border-radius:10px;position:relative}
  .row:hover{background:#ffffff05}
  .sym{display:flex;align-items:center;gap:9px}
  .tick{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 9.5px/1 var(--mono);
    background:#ffffff0a;color:var(--muted);border:1px solid #ffffff10;flex:0 0 auto;letter-spacing:.02em}
  .name{font-weight:600;font-size:13.5px}
  .amt{font:12px/1.4 var(--mono);color:var(--dim);margin-top:1px}
  .val{font:600 14px/1.3 var(--mono);text-align:right}
  .val small{display:block;font:11px/1.4 var(--mono);color:var(--dim);font-weight:400}
  .bar{grid-column:1/-1;height:3px;border-radius:3px;background:#ffffff08;overflow:hidden;margin-top:6px}
  .bar span{display:block;height:100%;border-radius:3px;opacity:.75}
  .empty{padding:26px 20px;text-align:center;color:var(--dim);font-size:13px}
  .subs{border-top:1px solid var(--line);padding:12px 14px 12px}
  .subs-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 8px;
    font:600 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
  .subs-head em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500;color:var(--dim);opacity:.75}
  .sub-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px}
  .sub-row:hover{background:#ffffff05}
  .sub-name{font-size:12.5px;font-weight:600;flex:1;min-width:0}
  .sub-name small{display:block;font:10.5px/1.5 var(--mono);color:var(--dim);font-weight:400;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:210px}
  .chip{font:10.5px/1 var(--mono);color:var(--muted);background:#ffffff08;border:1px solid #ffffff0f;
    padding:4px 6px;border-radius:5px;white-space:nowrap}
  .sub-val{font:600 12.5px/1.3 var(--mono);text-align:right;min-width:78px}
  .note{padding:10px 20px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--amber);line-height:1.5}
  .note.grey{color:var(--dim)}
  .err{margin:16px;padding:12px 14px;border-radius:10px;background:#ff6b6b12;border:1px solid #ff6b6b33;
    color:#ffb3b3;font:12px/1.55 var(--mono);word-break:break-word}
  .badge{font:600 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:4px 7px;border-radius:5px;
    background:#f0b42918;color:var(--amber);border:1px solid #f0b42938}
  footer{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--dim)}
  .toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  input[type=checkbox]{appearance:none;width:34px;height:19px;border-radius:20px;background:#232c3e;position:relative;
    cursor:pointer;transition:background .18s;border:1px solid var(--line)}
  input[type=checkbox]:checked{background:#1e6b57;border-color:#2a8a70}
  input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
    background:#94a3b8;transition:transform .18s,background .18s}
  input[type=checkbox]:checked::after{transform:translateX(15px);background:#fff}
  .sk{height:11px;border-radius:6px;background:linear-gradient(90deg,#1b2333,#232d42,#1b2333);
    background-size:200% 100%;animation:sh 1.3s infinite}
  @keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">BalanceViewer</div>
      <div class="total" id="total"><span class="unit">$</span>—</div>
      <h1 id="caption">KuCoin spot + Ethereum wallet</h1>
    </div>
    <div class="toolbar">
      <div class="stamp" id="stamp">loading…</div>
      <button class="primary" id="refresh"><span id="spin"></span>Refresh</button>
    </div>
  </header>

  <div class="cards" id="cards"></div>

  <footer>
    <label class="toggle"><input type="checkbox" id="auto" checked> Auto-refresh every 60s</label>
    <span id="meta">valued in USD · prices from KuCoin, DefiLlama, CoinGecko</span>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const ACCENT = { kucoin: "var(--green)", ethereum: "var(--purple)" };
let busy = false, timer = null, last = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const usd = (v) => {
  if (v === null || v === undefined) return "—";
  if (v !== 0 && Math.abs(v) < 0.01) return "<$0.01";
  return "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};

const price = (v) => {
  if (v === null || v === undefined) return "no price";
  if (v !== 0 && Math.abs(v) < 0.0001) return "$" + v.toExponential(2);
  return "$" + v.toLocaleString("en-US", { maximumFractionDigits: v < 1 ? 6 : 2 });
};

const qty = (v) => {
  if (v === 0 || v >= 1000) return v.toLocaleString("en-US", { maximumFractionDigits: 2 });
  if (v >= 1) return v.toLocaleString("en-US", { maximumFractionDigits: 4 });
  return v.toLocaleString("en-US", { maximumSignificantDigits: 4 });
};

function row(h, accent, total) {
  const share = total > 0 && h.value_usd ? Math.min(100, (h.value_usd / total) * 100) : 0;
  const initials = h.symbol.length > 4 ? h.symbol.slice(0, 3) : h.symbol;
  return `
    <div class="row">
      <div class="sym">
        <div class="tick">${esc(initials)}</div>
        <div style="min-width:0">
          <div class="name">${esc(h.symbol)}</div>
          <div class="amt">${qty(h.amount)}</div>
        </div>
      </div>
      <div class="val">${usd(h.value_usd)}<small>${price(h.price_usd)}</small></div>
      <div class="bar"><span style="width:${share.toFixed(2)}%;background:${accent}"></span></div>
    </div>`;
}

function subsBlock(s) {
  const subs = s.subaccounts || [];
  if (!subs.length) return "";
  const rows = subs.map((x) => {
    const chips = (x.holdings || []).slice(0, 3)
      .map((h) => `<span class="chip">${esc(qty(h.amount))} ${esc(h.symbol)}</span>`).join("");
    const more = (x.holdings || []).length > 3
      ? `<span class="chip">+${x.holdings.length - 3}</span>` : "";
    return `<div class="sub-row">
      <div class="sub-name">${esc(x.name)}<small>${esc(x.uid || "")}</small></div>
      <div class="chips">${chips}${more}</div>
      <div class="sub-val">${usd(x.total_usd)}</div>
    </div>`;
  }).join("");
  return `<div class="subs">
    <div class="subs-head"><span>Sub-accounts</span><em>${esc(s.subaccounts_mode || "")}</em></div>
    ${rows}
  </div>`;
}

function card(s) {
  const accent = ACCENT[s.id] || "var(--muted)";
  const base = s.holdings_total ?? s.total_usd;
  const rows = (s.holdings || []).map((h) => row(h, accent, base)).join("");
  const notes = (s.notes || []).map((n) => `<div class="note">${esc(n)}</div>`).join("");
  return `
    <section class="card">
      <div class="card-head">
        <div class="brand">
          <span class="dot" style="background:${accent}"></span>
          <div style="min-width:0">
            <h2>${esc(s.label)} ${s.stale ? '<span class="badge">stale</span>' : ""}</h2>
            <div class="sub">${esc(s.subtitle || "—")}</div>
          </div>
        </div>
        <div class="src-total">${usd(s.total_usd)}<small>${(s.holdings || []).length} asset${(s.holdings || []).length === 1 ? "" : "s"}</small></div>
      </div>
      ${s.error ? `<div class="err">${esc(s.error)}</div>` : ""}
      ${rows ? `<div class="rows">${rows}</div>` : (s.error ? "" : `<div class="empty">No balances</div>`)}
      ${subsBlock(s)}
      ${notes}
    </section>`;
}

function skeleton() {
  return `<section class="card"><div class="card-head">
      <div style="flex:1"><div class="sk" style="width:90px"></div><div class="sk" style="width:140px;margin-top:8px;height:8px"></div></div>
      <div class="sk" style="width:80px;height:20px"></div>
    </div><div class="rows">
      ${[0, 1, 2].map(() => `<div class="row"><div class="sk" style="width:120px"></div><div class="sk" style="width:64px"></div></div>`).join("")}
    </div></section>`;
}

async function load(force = false) {
  if (busy) return;
  busy = true;
  $("refresh").disabled = true;
  $("spin").outerHTML = '<span class="spin" id="spin"></span>';
  if (!last) $("cards").innerHTML = skeleton() + skeleton();
  try {
    const res = await fetch("/api/portfolio" + (force ? "?refresh=1" : ""), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    last = data;
    $("total").innerHTML = `<span class="unit">$</span>${(data.total_usd || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    $("caption").textContent = "KuCoin spot + " + (data.sources[1]?.label || "wallet");
    $("cards").innerHTML = data.sources.map(card).join("");
    const t = new Date(data.ts * 1000);
    $("stamp").innerHTML = `<b>${t.toLocaleTimeString("en-GB")}</b><br>${data.elapsed_ms} ms`;
    const stale = data.sources.some((s) => s.stale);
    $("meta").textContent = "valued in USD · prices from KuCoin, DefiLlama, CoinGecko" + (stale ? " · showing cached data" : "");
  } catch (err) {
    $("stamp").textContent = "offline";
    if (!last) $("cards").innerHTML = `<section class="card"><div class="err">${esc(err.message)}</div></section>`;
  } finally {
    busy = false;
    $("refresh").disabled = false;
    $("spin").outerHTML = "";
  }
}

function schedule() {
  clearInterval(timer);
  if ($("auto").checked) timer = setInterval(() => load(false), 60000);
}

$("refresh").addEventListener("click", () => load(true));
$("auto").addEventListener("change", schedule);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(false); });
load(true);
schedule();
</script>
</body>
</html>
